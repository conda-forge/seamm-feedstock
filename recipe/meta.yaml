{% set name = "seamm" %}
{% set version = "2026.9.25.1" %}
{% set sha256 = "e20e34af1c8857ab4e21ef90abc4b1fd49e1666c374659c897b6ec904ef92990" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/seamm-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  entry_points:
    - seamm=seamm.__main__:flowchart
    - run_flowchart=seamm.run_flowchart:run
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - bibtexparser <2
    - fasteners
    - humanize
    - jinja2
    - molsystem
    - numpy
    - packaging
    - pandas
    - pillow
    - pmw
    - py-cpuinfo
    - pyperclip
    - python >={{ python_min }}
    - python-dateutil
    - pyuca
    - reference-handler
    - seamm-dashboard-client
    - seamm-datastore
    - seamm-ff-util
    - seamm-util
    - seamm-widgets
    - stevedore

test:
  imports:
    - seamm
  commands:
    - pip check
    - seamm --help
  requires:
    - pip
    - freetype-py <2.4.0
    - python {{ python_min }}

about:
  home: https://github.com/molssi-seamm/seamm
  summary: The Simulation Environment for Atomistic and Molecular Modeling (SEAMM)
  license: LGPL-3.0-or-later
  license_file: LICENSE
  doc_url: https://molssi-seamm.github.io/

extra:
  recipe-maintainers:
    - paulsaxe
